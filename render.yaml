services:
  - type: web
    name: grace-shop
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: DB_PORT
        value: "4000"
      - key: DB_SSL
        value: "true"
      - key: DB_HOST
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: grace_shop
