<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f7fb" />
    <title>Grace Shop — Dashboard Penjualan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      try {
        var savedTheme = localStorage.getItem("grace-shop-theme");
        if (!savedTheme || (savedTheme !== "light" && savedTheme !== "dark" && savedTheme !== "oled")) {
          savedTheme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-theme", savedTheme);
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <a class="brand" href="#" aria-label="Grace Shop, beranda" data-page="dashboard">
          <span class="brand-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5h16M6.5 3v5M17.5 3v5M5 10h14v10H5zM8 14h3m2 0h3m-8 3h3" /></svg></span>
          <span class="brand-copy">Grace Shop<span>POINT OF SALE</span></span>
        </a>

        <div class="workspace-label">MENU UTAMA</div>
        <nav class="main-nav" aria-label="Navigasi utama">
          <button class="nav-link active" data-page="dashboard"><span class="nav-icon"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="8" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="15" width="7" height="6" rx="1.5"/></svg></span>Dashboard</button>
          <button class="nav-link" data-page="kasir"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M4 8h16l1 12H3L4 8Z"/><path d="M8 9V6a4 4 0 0 1 8 0v3M8 13h.01M12 13h.01M16 13h.01"/></svg></span>Kasir<span class="nav-badge">POS</span></button>
          <button class="nav-link" data-page="transaksi"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M7 3h8l4 4v14H7z"/><path d="M15 3v5h5M10 13h6m-6 4h6"/></svg></span>Transaksi</button>
          <button class="nav-link" data-page="produk"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 12 9 5 9-5M3 16l9 5 9-5"/></svg></span>Produk</button>
          <button class="nav-link" data-page="laporan"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M4 20V10m5 10V4m6 16v-7m5 7V7"/></svg></span>Laporan</button>
          <button class="nav-link" data-page="pengguna"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 7.75"/></svg></span>Pengguna</button>
        </nav>

        <div class="sidebar-bottom">
          <div class="help-card">
            <div class="help-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.6 9a2.5 2.5 0 1 1 4.3 1.7c-1 .9-1.9 1.2-1.9 2.8m0 3h.01"/></svg></div>
            <strong>Butuh bantuan?</strong>
            <p>Kelola tokomu jadi lebih mudah.</p>
            <button type="button" class="help-link" id="helpButton">Pelajari cara kerja <span>↗</span></button>
          </div>
          <button class="profile-button" id="profileButton" type="button">
            <span class="avatar" id="profileAvatar">AK</span><span class="profile-copy"><strong id="profileName">Admin Grace Shop</strong><small id="profileRole">Administrator</small></span><span class="profile-more">···</span>
          </button>
        </div>
      </aside>

      <main class="main-area">
        <header class="topbar">
          <button class="mobile-menu" id="mobileMenu" type="button" aria-label="Buka menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
          <div class="breadcrumb"><span>Pages</span><span class="crumb-slash">/</span><strong id="breadcrumbCurrent">Dashboard</strong></div>
          <div class="topbar-actions">
            <label class="global-search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m16 16 4 4"/></svg><input id="globalSearch" type="search" placeholder="Cari produk, transaksi..." /><kbd>⌘ K</kbd></label>
            <button class="icon-button notification-button" type="button" aria-label="Notifikasi" id="notificationButton"><svg viewBox="0 0 24 24"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9m-8 13h4"/></svg><i></i></button>
            <span class="topbar-divider"></span>
            <div class="date-display"><span class="date-dot"></span><span id="todayLabel"></span></div>
          </div>
          <button type="button" id="themeToggle" class="icon-button theme-toggle" aria-label="Ubah ke tema gelap" title="Ubah tema">
            <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" /></svg>
            <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" /></svg>
  <svg class="icon-oled" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" /><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" stroke="none" /></svg>
          </button>
          <form class="logout-form" method="post" action="/logout">
    <button class="button danger" type="submit">Keluar</button>
  </form>
  </header>
        <div class="content" id="pageContent"></div>
      </main>
    </div>
oD    <div class="toast-region" id="toastRegion" aria-live="polite"></div>
    <div class="modal-layer" id="modalLayer"></div>
    <script src="app.js"></script>
  </body>
</html>
